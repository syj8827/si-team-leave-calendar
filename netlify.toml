[build]
  publish = "."
  # 함수가 @netlify/blobs 를 찾을 수 있게 의존성 설치를 명시한다
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 팀즈 탭은 iframe 이라 임베드를 막으면 안 된다. 검색 노출만 차단.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
