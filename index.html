<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SI팀 휴가</title>
<style>
/* 나눔스퀘어라운드 — 네이버 나눔글꼴 (상업 사용·재배포 허용). 한글 2,350자 + 영문 94자.
   로컬에 설치돼 있으면 그걸 쓰고, 없으면 레포에 담긴 woff2 를 받는다. */
@font-face{
  font-family:"NanumSquareRound"; font-style:normal; font-weight:400; font-display:swap;
  src:local("NanumSquareRoundR"), url("fonts/NanumSquareRoundR.woff2") format("woff2");
}
@font-face{
  font-family:"NanumSquareRound"; font-style:normal; font-weight:700; font-display:swap;
  src:local("NanumSquareRoundB"), url("fonts/NanumSquareRoundB.woff2") format("woff2");
}
@font-face{
  font-family:"NanumSquareRound"; font-style:normal; font-weight:800; font-display:swap;
  src:local("NanumSquareRoundEB"), url("fonts/NanumSquareRoundEB.woff2") format("woff2");
}

/* ─────────────────────────────────────────────────────────────
   읽는 게 1순위. 글자가 놓이는 면은 전부 불투명 흰 타일이고,
   배경(Reactive Grid)은 타일 사이 여백에서만 보인다.
   상시 움직이는 것은 배경 하나뿐 — 나머지 모션은 누를 때만 한 번씩 일어난다.
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#F4FAF8; --tile:#FFFFFF; --sink:#EDF4F1; --pad:#E7EFEC;
  --ink:#16211E; --ink2:#5C6B66; --ink3:#98A6A1; --line:#DBE7E2;
  --accent:#0B8F74; --warn:#D14D74;
  /* 나눔스퀘어라운드로 한글·숫자·영문 전부 통일 (레포에 self-host, 외부 요청 없음) */
  --kr:"NanumSquareRound","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --h:118px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);font-size:14px;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
/* 파스텔 오브 2개 — 정적이라 배터리를 쓰지 않는다 */
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(680px 460px at 14% 8%, #D5F2E8 0%, transparent 66%),
  radial-gradient(620px 420px at 90% 88%, #E6F4D8 0%, transparent 66%),
  var(--bg)}
#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%;display:block}

/* 이모지 버스트 (등록 순간에만) */
#burst{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
#burst span{position:absolute;font-size:21px;line-height:1;will-change:transform,opacity;
  animation:fly .95s cubic-bezier(.2,.7,.3,1) both}
@keyframes fly{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
  16%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 96px)) scale(.9) rotate(var(--rot));opacity:0}
}

.wrap{max-width:1300px;margin:0 auto;padding:28px 24px 48px}
.lbl{font-family:var(--kr);font-size:10.5px;letter-spacing:.13em;color:var(--ink2)}

/* ── 헤더 ── */
.head{display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:var(--kr);font-size:clamp(54px,7.4vw,96px);font-weight:800;line-height:.88;
  letter-spacing:-.018em;font-variant-numeric:lining-nums tabular-nums;display:flex;overflow:hidden}
h1 i{font-style:normal;display:inline-block;animation:rise .55s var(--ease) both}
h1 i.p{color:var(--accent)}
@keyframes rise{from{transform:translateY(108%)}to{transform:translateY(0)}}

.sum{display:flex;flex-direction:column;gap:9px;max-width:540px}
.sum .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--ink2)}
.sum .v .chip{font-size:13px}

.nav{display:flex;gap:5px;align-items:center}
.nav button{font:inherit;font-family:var(--kr);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:#fff;border:1px solid var(--line);color:var(--ink2);border-radius:999px;
  padding:9px 16px;cursor:pointer;transition:transform .2s var(--spring),background .16s,color .16s}
.nav button:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.nav button:active{transform:scale(.94)}
.nav .cta{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.nav .cta.on{background:var(--ink);border-color:var(--ink)}

/* ── 등록 폼 ── */
.add{overflow:hidden;max-height:0;transition:max-height .4s var(--ease),margin .4s var(--ease)}
.add.on{max-height:380px;margin-bottom:20px}
.fields{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.4fr auto;gap:12px;align-items:end;
  background:var(--tile);border:1px solid var(--line);border-radius:22px;padding:20px 22px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f input{font:inherit;font-family:var(--kr);border:1px solid var(--line);background:#fff;
  border-radius:999px;padding:11px 16px;color:var(--ink);width:100%;transition:border-color .16s}
.f input:focus{outline:2px solid #0b8f7433;outline-offset:1px;border-color:var(--accent)}
.f input[type=date]{font-family:var(--kr);font-size:12.5px}
.save{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:999px;
  padding:12px 26px;cursor:pointer;white-space:nowrap;transition:transform .2s var(--spring),filter .16s}
.save:hover{filter:brightness(1.09)}
.save:active{transform:scale(.93)}
.save[disabled]{opacity:.55;cursor:default}
.msg{margin-top:11px;font-size:12.5px;line-height:1.55;display:none}
.msg.on{display:block}
.msg.bad{color:var(--warn);font-weight:700}
.msg code{font-family:var(--kr);font-size:11.5px;background:var(--sink);
  padding:8px 11px;border-radius:9px;display:block;margin-top:7px;word-break:break-all}

/* ── 달력 ── */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:9px}
.wk div{padding-left:15px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.d{background:var(--tile);border-radius:16px;min-height:var(--h);padding:11px 11px 13px;
  display:flex;flex-direction:column;gap:8px;
  box-shadow:0 2px 8px -4px #16211e14;
  animation:pop .4s var(--ease) both;animation-delay:calc(var(--i) * 9ms);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.d.off{background:var(--sink);box-shadow:none}
.d.pad{background:var(--pad);box-shadow:none}
/* 커서가 올라간 칸 하나만 살짝 뜬다 — 주변 칸은 가만히 있는다 */
.d[data-date]{cursor:pointer}
.d[data-date]:hover{transform:translateY(-3px);box-shadow:0 10px 20px -10px #0b8f7440;z-index:2;position:relative}
.d.now{box-shadow:inset 0 0 0 2px var(--accent),0 2px 8px -4px #16211e14}
.d.burst{position:relative}
.d.burst::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  border:2px solid var(--accent);animation:ring .7s var(--ease) both}
@keyframes ring{0%{transform:scale(.94);opacity:.9}100%{transform:scale(1.1);opacity:0}}

.dn{display:flex;align-items:center;gap:7px;min-height:24px;flex-wrap:wrap;row-gap:2px}
.dn b{font-family:var(--kr);font-size:20px;font-weight:700;line-height:1;letter-spacing:-.01em;
  font-variant-numeric:lining-nums tabular-nums}
.d.off .dn b{color:var(--ink2);font-weight:600}
.d.pad .dn b{color:var(--ink3);font-weight:600}
.d.now .dn b{color:var(--accent)}
.dn .hl{font-size:11px;font-weight:700;color:var(--warn);margin-left:auto}
.dn .ct{font-family:var(--kr);font-size:10px;color:var(--ink3);margin-left:auto}
.dn .hl ~ .ct{margin-left:7px}

/* ── 이름 칩 ── */
.who{display:flex;flex-direction:column;gap:4px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 11px 5px 9px;border-radius:999px;
  background:var(--cb);color:var(--c);font-size:13px;font-weight:700;letter-spacing:-.01em;
  transition:transform .18s var(--spring)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cd);flex:0 0 auto}
.chip i{font-style:normal;font-size:10.5px;font-weight:500;opacity:.75;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[data-id]{cursor:pointer}
.chip[data-id]:hover{transform:scale(1.05)}
.chip.new{animation:popin .5s var(--spring) both}
@keyframes popin{0%{transform:scale(.55);opacity:0}62%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.chip.gone{animation:popout .28s var(--ease) both}
@keyframes popout{to{transform:scale(.5);opacity:0}}

.foot{margin-top:18px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.foot span{font-family:var(--kr);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.err{margin-top:14px;padding:11px 16px;border-radius:0 14px 14px 0;border-left:3px solid var(--warn);
  background:#fdeff3;font-size:12.5px;color:#8b2c4a}

@media (max-width:860px){
  :root{--h:78px}
  .wrap{padding:16px 11px 32px}
  .fields{grid-template-columns:1fr 1fr;gap:10px;border-radius:18px}
  .fields .f:nth-child(4),.save{grid-column:1/-1}
  .wk,.grid{gap:6px}
  .wk div{padding-left:8px;font-size:9px;letter-spacing:.05em}
  .d{padding:7px 6px 9px;gap:5px;border-radius:12px}
  .dn b{font-size:16px}
  .chip{font-size:11.5px;padding:3px 8px 4px 6px;gap:4px}
  .chip i{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::after,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="burst" aria-hidden="true"></div>

<div class="wrap">
  <div class="head">
    <h1 id="label"></h1>
    <div class="sum">
      <div class="lbl" id="k">—</div>
      <div class="v" id="v">—</div>
    </div>
    <div class="nav">
      <button id="prev">◄ Prev</button>
      <button id="today">Today</button>
      <button id="next">Next ►</button>
      <button id="toggle" class="cta">휴가 등록</button>
    </div>
  </div>

  <div class="add" id="add">
    <div class="fields">
      <div class="f"><span class="lbl">이름</span>
        <input id="f-name" list="names" autocomplete="off" placeholder="이름" maxlength="20"></div>
      <datalist id="names"></datalist>
      <div class="f"><span class="lbl">시작</span><input id="f-from" type="date"></div>
      <div class="f"><span class="lbl">종료</span><input id="f-to" type="date"></div>
      <div class="f"><span class="lbl">메모 (생략 가능)</span>
        <input id="f-note" placeholder="여름휴가" maxlength="40"></div>
      <button class="save" id="f-save">등록</button>
    </div>
    <div class="msg" id="f-msg"></div>
  </div>

  <div class="wk">
    <div class="lbl">Sun</div><div class="lbl">Mon</div><div class="lbl">Tue</div><div class="lbl">Wed</div>
    <div class="lbl">Thu</div><div class="lbl">Fri</div><div class="lbl">Sat</div>
  </div>
  <div class="grid" id="grid"></div>

  <div id="err"></div>
  <div class="foot"><span id="src">—</span><span>GG SI TEAM</span></div>
</div>

<script src="data.js"></script>
<script>
/* ════════ 기본 ════════ */
const D = window.CAL_DATA;
const API = "/api/leaves";
const WD = ["일","월","화","수","목","금","토"];
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const valid = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && iso(parse(s)) === s;
const TODAY = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
let cur = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
let leaves = [];
let live = false;
let justAdded = null;

/* 서버가 준 id 가 없으면(오프라인·폴백) 여기서 발급한다 — 삭제는 id 로 찾으므로 없으면 지울 수 없다 */
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "loc-" + Date.now().toString(36) + Math.random().toString(36).slice(2,8));
const withId = r => r.id ? r : { ...r, id: uid() };

/* 보라 계열(250~330) 제외. 인접 순번끼리 최소 46도 벌어지게 배열 */
const HUES = [138,0,184,46,230,92,345,161,23,207,69,115];
let roster = [];
function tone(name){
  const h = HUES[Math.max(0, roster.indexOf(name)) % HUES.length];
  return { c:`hsl(${h} 44% 29%)`, cb:`hsl(${h} 70% 92%)`, cd:`hsl(${h} 56% 60%)` };
}

const isOff = d => d.getDay() === 0 || d.getDay() === 6 || !!D.holidays[iso(d)];
/* 주말·공휴일은 전원 휴무라 휴가자를 표시하지 않는다 */
const onLeave = day => isOff(day) ? [] : leaves
  .filter(l => parse(l.start) <= day && day <= parse(l.end || l.start))
  .sort((a,b) => a.name.localeCompare(b.name,"ko"));

function chipHtml(p, fresh, plain){
  const t = tone(p.name);
  const span = p.end && p.end !== p.start ? ` ~ ${p.end}` : "";
  const del = !plain && p.id;
  const tip = `${p.name} · ${p.start}${span}${p.note ? " · " + p.note : ""}`
    + (del ? " — 눌러서 삭제" : "");
  return `<span class="chip${fresh ? " new" : ""}" style="--c:${t.c};--cb:${t.cb};--cd:${t.cd}"`
    + `${del ? ` data-id="${p.id}"` : ""} title="${tip}">`
    + `${p.name}${p.note ? `<i>${p.note}</i>` : ""}</span>`;
}

/* ════════ 렌더 ════════ */
function render(){
  const y = cur.getFullYear(), m = cur.getMonth();
  const dim = new Date(y, m+1, 0).getDate();
  const lead = new Date(y, m, 1).getDay();
  const total = Math.ceil((lead + dim) / 7) * 7;

  roster = [...new Set(leaves.map(l => l.name))].sort((a,b) => a.localeCompare(b,"ko"));
  document.getElementById("names").innerHTML = roster.map(n => `<option value="${n}">`).join("");
  document.getElementById("label").innerHTML =
    [...`${y}.${pad(m+1)}`].map((c,i) =>
      `<i class="${c === "." ? "p" : ""}" style="animation-delay:${i*36}ms">${c}</i>`).join("");

  let cells = "";
  for (let i = 0; i < total; i++){
    const d = new Date(y, m, i - lead + 1);
    const inM = d.getMonth() === m && d.getFullYear() === y;
    const hol = inM ? D.holidays[iso(d)] : null;
    const now = inM && +d === +TODAY;
    const ppl = inM ? onLeave(d) : [];
    const ring = !!justAdded && inM && iso(d) === justAdded.start;
    const chips = ppl.map(p => chipHtml(p, justAdded && p.id === justAdded.id)).join("");

    cells += `<div class="${["d", inM ? "" : "pad", now ? "now" : (inM && isOff(d) ? "off" : ""),
        ring ? "burst" : ""].filter(Boolean).join(" ")}"`
      + ` style="--i:${i}"${inM && !isOff(d) ? ` data-date="${iso(d)}"` : ""}>`
      + `<div class="dn"><b>${pad(d.getDate())}</b>`
      + (hol ? `<span class="hl">${hol}</span>` : "")
      + (ppl.length > 1 ? `<span class="ct">${ppl.length}</span>` : "")
      + `</div><div class="who">${chips}</div></div>`;
  }
  document.getElementById("grid").innerHTML = cells;

  const t = onLeave(TODAY);
  document.getElementById("k").textContent = `오늘 ${iso(TODAY)} ${WD[TODAY.getDay()]}`;
  document.getElementById("v").innerHTML = t.length
    ? "휴가 " + t.map(p => chipHtml(p, false, true)).join("")
    : (isOff(TODAY) ? "휴무일" : "전원 근무");
  wake();
}

/* ════════ API ════════ */
const passcode = () => sessionStorage.getItem("pc") || "";
function headers(){
  const h = { "content-type": "application/json" };
  if (passcode()) h["x-team-passcode"] = passcode();
  return h;
}

async function load(){
  const src = document.getElementById("src"), err = document.getElementById("err");
  try {
    const res = await fetch(API + "?t=" + Date.now(), { headers:{ "cache-control":"no-cache" } });
    if (!res.ok) throw new Error("응답 " + res.status);
    const list = await res.json();
    if (!Array.isArray(list)) throw new Error("형식 오류");
    leaves = list; live = true; err.innerHTML = "";
    src.textContent = `${leaves.length} records · ${new Date().toLocaleTimeString("ko-KR")}`;
  } catch(e) {
    leaves = D.fallback.map(withId); live = false;
    src.textContent = "offline preview";
    err.innerHTML = "저장소에 연결되지 않아 예시 데이터를 보여주는 중입니다. "
      + "배포된 주소에서 열면 등록·삭제가 됩니다.";
  }
  render();
}

/* ════════ 이모지 버스트 (등록 성공 순간에만) ════════ */
const EMOJIS = ["🌴","🍉","✈️","🐳","🍒","🧊","☀️","🛟","🥤"];
function emojiBurst(el, count = 9){
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const layer = document.getElementById("burst");
  for (let i = 0; i < count; i++){
    const s = document.createElement("span");
    s.textContent = EMOJIS[i % EMOJIS.length];
    const ang = -Math.PI / 2 + (i / (count - 1) - .5) * 1.7;     // 위로 부채꼴 (spread)
    const v = 96 + Math.random() * 78;
    s.style.cssText = `left:${cx}px;top:${cy}px;`
      + `--dx:${(Math.cos(ang) * v).toFixed(1)}px;--dy:${(Math.sin(ang) * v).toFixed(1)}px;`
      + `--rot:${(Math.random() * 100 - 50).toFixed(0)}deg;animation-delay:${i * 16}ms`;
    layer.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

/* ════════ 등록 · 삭제 ════════ */
const addBox = document.getElementById("add"), msg = document.getElementById("f-msg");
const F = id => document.getElementById("f-" + id);
const say = (html, bad) => { msg.className = "msg on" + (bad ? " bad" : ""); msg.innerHTML = html; };

function openForm(date){
  addBox.classList.add("on");
  document.getElementById("toggle").classList.add("on");
  if (date){ F("from").value = date; F("to").value = date; }
  F("name").focus();
}
function closeForm(){
  addBox.classList.remove("on");
  document.getElementById("toggle").classList.remove("on");
}
document.getElementById("toggle").onclick = () =>
  addBox.classList.contains("on") ? closeForm() : openForm();

async function submit(){
  const btn = document.getElementById("f-save");
  const name = F("name").value.trim(), from = F("from").value;
  const to = F("to").value || from, note = F("note").value.trim();

  if (!name)                   return say("이름을 입력하세요.", true);
  if (!valid(from))            return say("시작일을 선택하세요.", true);
  if (!valid(to))              return say("종료일이 올바르지 않습니다.", true);
  if (parse(to) < parse(from)) return say("종료일이 시작일보다 앞섭니다.", true);

  const rec = { name, start: from, end: to, note };
  const done = saved => {
    leaves = leaves.concat(saved);
    justAdded = saved;
    cur = new Date(parse(from).getFullYear(), parse(from).getMonth(), 1);   // 등록한 달을 보여준다
    render();
    emojiBurst(btn);
    setTimeout(() => { justAdded = null; }, 900);
    F("name").value = ""; F("note").value = "";
  };

  if (!live){
    const line = `{ name: "${name}", start: "${from}", end: "${to}"${note ? `, note: "${note}"` : ""} },`;
    done(withId(rec));
    say(`저장소에 연결되지 않아 화면에만 반영했습니다. 배포 주소에서 열면 실제로 저장됩니다.<code>${line}</code>`);
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch(API, { method:"POST", headers:headers(), body:JSON.stringify(rec) });
    if (res.status === 401){
      const pc = prompt("팀 암호를 입력하세요.");
      if (pc){ sessionStorage.setItem("pc", pc); btn.disabled = false; return submit(); }
      throw new Error("암호가 필요합니다");
    }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "응답 " + res.status);
    done(await res.json());
    say(`<b>${name}</b> ${from}${to !== from ? " ~ " + to : ""} 등록했습니다.`);
  } catch(e){
    say("등록하지 못했습니다 — " + e.message, true);
  } finally {
    btn.disabled = false;
  }
}
document.getElementById("f-save").onclick = submit;
addBox.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

const grid = document.getElementById("grid");
grid.addEventListener("click", async e => {
  const chip = e.target.closest(".chip[data-id]");
  if (chip){
    e.stopPropagation();
    const rec = leaves.find(l => l.id === chip.dataset.id);
    if (!rec || !confirm(`${rec.name} ${rec.start}${rec.end !== rec.start ? " ~ " + rec.end : ""} 삭제할까요?`)) return;
    chip.classList.add("gone");
    if (!live){                                  // 저장소가 없으면 화면에서만 지운다
      setTimeout(() => { leaves = leaves.filter(l => l.id !== rec.id); render(); }, 260);
      return;
    }
    try {
      const res = await fetch(`${API}?id=${encodeURIComponent(rec.id)}`, { method:"DELETE", headers:headers() });
      if (res.status === 401){
        const pc = prompt("팀 암호를 입력하세요.");
        if (pc) sessionStorage.setItem("pc", pc);
        chip.classList.remove("gone"); return;
      }
      if (!res.ok) throw new Error("응답 " + res.status);
      leaves = leaves.filter(l => l.id !== rec.id);
      render();
    } catch(err){
      chip.classList.remove("gone");
      say("삭제하지 못했습니다 — " + err.message, true);
    }
    return;
  }
  const cell = e.target.closest(".d[data-date]");
  if (cell) openForm(cell.dataset.date);
});

document.getElementById("prev").onclick = () => { cur.setMonth(cur.getMonth()-1); render(); };
document.getElementById("next").onclick = () => { cur.setMonth(cur.getMonth()+1); render(); };
document.getElementById("today").onclick = () => { cur = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); load(); };

/* ════════ 배경: Reactive Grid (originkit) ════════
   격자마다 라운드 사각형 하나. 커서에 가까울수록 커지고 목표 크기로 부드럽게 이징한다.
   타일이 불투명하므로 글자 뒤에서는 보이지 않고 타일 사이 여백에서만 보인다.
   전부 멈추고 8초간 입력이 없으면 rAF 를 멈춘다 — 종일 켜둬도 배터리를 태우지 않는다. */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MIN = 9, MAX = 26, GAP = 6, INFLUENCE = 240, CELL = MAX + GAP, EASE = .16;
const PARTICLE = "rgba(11,143,116,.11)";
const cv = document.getElementById("bg");
const ctx = cv.getContext("2d");
const hasRound = typeof ctx.roundRect === "function";
let cols = 0, rows = 0, sizes = new Float32Array(0);
let px = -9e9, py = -9e9;
let running = false, visible = true, lastAct = 0;

function layout(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width  = Math.max(1, Math.round(innerWidth  * dpr));
  cv.height = Math.max(1, Math.round(innerHeight * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cols = Math.ceil(innerWidth  / CELL) + 1;
  rows = Math.ceil(innerHeight / CELL) + 1;
  const next = new Float32Array(cols * rows).fill(MIN);
  next.set(sizes.subarray(0, Math.min(sizes.length, next.length)));
  sizes = next;
}

function paint(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.fillStyle = PARTICLE;
  ctx.beginPath();                        // 도형 전체를 한 경로에 모아 한 번만 채운다
  let settling = false;
  for (let r = 0; r < rows; r++){
    const cy = r * CELL + CELL / 2;
    for (let c = 0; c < cols; c++){
      const cx = c * CELL + CELL / 2;
      const d = Math.hypot(px - cx, py - cy);
      let t = d < INFLUENCE ? 1 - d / INFLUENCE : 0;
      t = t * t * (3 - 2 * t);             // 부드러운 감쇠
      const target = MIN + (MAX - MIN) * t;
      const i = r * cols + c;
      const s = sizes[i] + (target - sizes[i]) * EASE;
      sizes[i] = s;
      if (Math.abs(target - s) > .06) settling = true;
      const half = s / 2;
      if (hasRound) ctx.roundRect(cx - half, cy - half, s, s, s * .32);
      else ctx.rect(cx - half, cy - half, s, s);
    }
  }
  ctx.fill();
  return settling;
}

function loop(ms){
  if (!running) return;
  const busy = paint();
  if (!busy && ms - lastAct > 8000){ running = false; return; }
  requestAnimationFrame(loop);
}
function wake(){
  lastAct = performance.now();
  if (!running && visible && !REDUCED){ running = true; requestAnimationFrame(loop); }
}

layout();
if (REDUCED) paint();
else {
  addEventListener("resize", () => { layout(); if (!running) paint(); });
  addEventListener("pointermove", e => { px = e.clientX; py = e.clientY; wake(); }, {passive:true});
  addEventListener("pointerdown", wake, {passive:true});
  addEventListener("scroll", wake, {passive:true});
  document.addEventListener("pointerleave", () => { px = py = -9e9; wake(); });
  document.addEventListener("visibilitychange", () => {
    visible = document.visibilityState === "visible";
    visible ? wake() : running = false;
  });
  wake();
}

load();
setInterval(load, 60000);          // 1분마다 다른 사람이 올린 건 반영

/* ════════ 자가검증 — 콘솔에서 selftest() ════════ */
function selftest(){
  const out = [], ok = (c,m) => out.push((c ? "ok   " : "FAIL ") + m);
  const cs = [...document.querySelectorAll("#grid .d")];
  const dim = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const opaque = el => {
    const bg = getComputedStyle(el).backgroundColor;
    const m = bg.match(/rgba?\(([^)]+)\)/);
    return !m || (m[1].split(",").length < 4 || parseFloat(m[1].split(",")[3]) >= .999);
  };

  /* 달력 정확성 */
  ok(cs.length % 7 === 0, "칸 수가 7의 배수 (" + cs.length + ")");
  ok(cs[new Date(cur.getFullYear(),cur.getMonth(),1).getDay()].querySelector("b").textContent === "01", "1일이 요일 위치에 맞음");
  ok(cs.filter(e => e.classList.contains("pad")).length === cs.length - dim, "이전·다음 달 칸 수 정확");
  ok(!cs.some(e => e.classList.contains("pad") && e.querySelector(".chip")), "이전·다음 달 칸엔 이름 없음");
  ok(!cs.some(e => e.classList.contains("off") && e.querySelector(".chip")), "주말·공휴일 칸엔 이름 없음");
  ok(!document.querySelector(".d.off[data-date],.d.pad[data-date]"), "휴무일 칸은 클릭 대상 아님");
  ok(onLeave(parse("2026-08-15")).length === 0 && onLeave(parse("2026-08-17")).length === 0,
     "광복절·대체공휴일엔 휴가자 안 뜸");
  ok(valid("2026-08-03") && !valid("2026-02-30") && !valid("2026-8-3"), "날짜 유효성 검사");

  /* 가독성 — 글자가 놓이는 면은 전부 불투명, 배경은 뒤에서 안 보인다 */
  ok(cs.every(opaque), "모든 달력 칸이 불투명");
  ok(opaque(document.querySelector(".fields")), "등록 폼이 불투명");
  ok(cs.every(e => getComputedStyle(e).backdropFilter === "none"), "칸에 배경 블러 없음");
  ok(!getComputedStyle(document.querySelector(".chip"), "::after").content.includes('""')
     || getComputedStyle(document.querySelector(".chip"), "::after").animationName === "none", "칩에 광택 훑기 없음");
  ok(![...document.querySelectorAll("#grid b")].some(b => b.style.fontWeight), "날짜 굵기가 커서에 따라 변하지 않음");
  ok(document.querySelectorAll(".d.lift").length === 0, "주변 칸 물결 리프트 없음");

  /* 색·타이포 */
  ok(new Set(roster.map(n => tone(n).cb)).size === roster.length, "명단 전원 색이 서로 다름");
  ok(HUES.every(h => h < 250 || h > 330), "사람 색에 보라 계열 없음");
  ok(+tone(roster[0] || "x").cb.match(/(\d+)%\)$/)[1] >= 85, "칩 배경이 파스텔");
  ok(css("--accent") === "#0B8F74", "액센트가 민트그린");
  ok(getComputedStyle(document.querySelector("h1")).fontFamily.includes("NanumSquareRound"),
     "나눔스퀘어라운드 적용");
  ok(document.fonts.check('700 20px "NanumSquareRound"'), "굵은 자체(700)가 실제로 로드됨");
  ok(document.fonts.check('800 90px "NanumSquareRound"'), "월 표시 자체(800)가 로드됨");
  ok(getComputedStyle(document.querySelector("h1")).fontWeight === "800", "월 표시가 ExtraBold");
  ok(document.fonts.check('400 14px "NanumSquareRound"'), "기본 자체(400)가 실제로 로드됨");
  ok(getComputedStyle(document.body).fontFamily.includes("NanumSquareRound"), "본문도 같은 폰트");
  (() => {                                   // 날짜 숫자는 폭·높이가 고르게 정렬돼야 한다
    const c = document.createElement("canvas").getContext("2d");
    c.font = getComputedStyle(cs.find(e => !e.classList.contains("pad")).querySelector("b")).font;
    const w = [..."0123456789"].map(d => c.measureText(d).width);
    ok(Math.max(...w) - Math.min(...w) < .5, `0~9 폭이 균일 (편차 ${(Math.max(...w)-Math.min(...w)).toFixed(2)}px)`);
  })();

  /* Reactive Grid */
  ok(cols > 1 && rows > 1 && sizes.length === cols * rows, `배경 격자 ${cols}×${rows}`);
  const before = sizes[0];
  px = CELL / 2; py = CELL / 2;
  for (let i = 0; i < 40; i++) paint();
  ok(sizes[0] > before + 3, `커서 근처 입자가 부풀음 ${before.toFixed(1)} → ${sizes[0].toFixed(1)}`);
  ok(sizes[sizes.length - 1] < sizes[0], "먼 입자는 작게 유지");
  px = py = -9e9;
  for (let i = 0; i < 90; i++) paint();
  ok(sizes[0] < MIN + 1, `커서가 떠나면 원래대로 ${sizes[0].toFixed(1)}`);
  ok(MAX <= 26 && parseFloat(PARTICLE.match(/[\d.]+\)$/)[0]) <= .12, "배경이 차분한 값으로 조정됨");

  /* 이모지 버스트 */
  const layer = document.getElementById("burst");
  layer.innerHTML = "";
  emojiBurst(document.getElementById("f-save"));
  const n = layer.children.length;
  ok(n === 9, `이모지 ${n}개 생성`);
  ok([...layer.children].every(s => s.style.getPropertyValue("--dx") && s.style.getPropertyValue("--dy")),
     "이모지마다 퍼짐 방향 지정됨");
  ok(getComputedStyle(layer).pointerEvents === "none", "버스트 레이어가 클릭을 막지 않음");
  layer.innerHTML = "";

  /* 삭제 경로 */
  ok(leaves.every(l => l.id), "모든 레코드에 id 가 있다 (없으면 삭제 불가)");
  ok([...document.querySelectorAll("#grid .chip")].every(c => c.dataset.id), "달력 칩이 전부 삭제 대상");
  ok([...document.querySelectorAll(".sum .chip")].every(c => !c.dataset.id), "요약줄 칩은 삭제 대상 아님");
  ok(document.querySelectorAll("#grid .chip[data-id]").length > 0 &&
     getComputedStyle(document.querySelector("#grid .chip[data-id]")).cursor === "pointer",
     "삭제 가능한 칩은 손가락 커서");

  ok(document.body.scrollWidth <= document.body.clientWidth + 1, "가로 스크롤 없음");
  return out.join("\n");
}
